<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>空飛ぶ仏像</title>
<meta name="description" content="お金を吸い込め！仏の力で天まで昇れ！ 仏像が賽銭・小判・硬貨を吸い込み、そのエネルギーで天へ昇っていく3Dブラウザゲーム">
<meta name="theme-color" content="#1a0d04">
<link rel="stylesheet" href="style.css?v=202611110116">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="app">
<canvas id="c" aria-label="空飛ぶ仏像 ゲーム画面"></canvas>

<!-- 上部：スコア・高度 -->
<div id="hud" class="hidden">
  <div class="hud-row">
    <div class="plate left">
      <div class="lbl" data-i18n="hudMax">最高高度</div>
      <div class="num gold" id="score">0</div>
      <div class="sub"><span data-i18n="hudBest">👑 ベスト</span> <span id="bestHud">0</span>m</div>
    </div>
    <div class="stage-ribbon"><span id="stageName">第1天 地上の寺院</span></div>
    <div class="plate right">
      <div class="lbl" data-i18n="hudAlt">高度</div>
      <div class="num gold"><span id="alt">0</span><small>m</small></div>
      <div class="sub"><span data-i18n="hudRise">上昇</span> <b id="speed">0</b> m/s</div>
    </div>
  </div>
  <div class="hud-row second">
    <div class="money"><i class="coin-ico"></i><span id="money">0</span></div>
    <div class="form"><span id="formName">Lv.1 木造仏</span><div class="togo" id="goalLbl"></div></div>
  </div>
  <div id="status"></div>
  <button id="pauseBtn" type="button" aria-label="一時停止">Ⅱ</button>
</div>


<div id="floaters"></div>
<div id="banner"></div>
<div id="flash"></div>
<div id="danger"></div>

<!-- タイトル -->
<section id="title" class="screen">
  <div class="title-top">
    <div class="catch" data-i18n-html="catch">お金を吸い込め！<br>仏の力で天まで昇れ！</div>
    <h1 class="logo"><span data-i18n="logo1">空飛ぶ</span><span data-i18n="logo2">仏像</span></h1>
  </div>
  <div class="title-bottom">
    <button class="btn gold-btn big" id="startBtn" type="button">スタート</button>
    <div class="row">
      <button class="btn round" id="templeBtn" type="button" data-i18n="templeBtn">お寺</button>
      <button class="btn round" id="howBtn" type="button" data-i18n="howBtn">遊び方</button>
      <button class="btn round" id="soundBtn" type="button">♪ 音</button>
      <button class="btn round" id="langBtn" type="button" data-i18n="langBtn">English</button>
    </div>
    <div class="best" id="bestTitle"></div>
    <div class="legal" id="legal" hidden>
      <span id="buildInfo"></span>
      <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="privacy">プライバシーポリシー</a>
      <span id="adPrivacy" hidden>｜<a href="#" id="adPrivacyLink" data-i18n="adSettings">広告の設定</a></span>
    </div>
  </div>
</section>

<section id="how" class="screen hidden">
  <div class="card">
    <h2 class="gold" data-i18n="howTitle">遊び方</h2>
    <ul class="rules" id="rules"></ul>
    <div class="legend">
      <div><i class="lg zeni"></i><span data-i18n-html="lgZeni"></span></div>
      <div><i class="lg koban"></i><span data-i18n-html="lgKoban"></span></div>
      <div><i class="lg gori"></i><span data-i18n-html="lgGori"></span></div>
      <div><i class="lg" style="background:radial-gradient(circle,#fff2a0,#c88a10 60%,#5a3a00);box-shadow:0 0 10px 3px rgba(255,200,60,.8)"></i><span data-i18n-html="lgCrow"></span></div>
    </div>
        <p class="evo-line" data-i18n-html="storm"></p>
    <button class="btn gold-btn" id="howClose" type="button" data-i18n="close">閉じる</button>
  </div>
</section>

<section id="templeScr" class="screen hidden">
  <div class="card">
    <h2 class="gold" data-i18n="templeTitle">お寺</h2>
    <div class="wallet"><span data-i18n="walletLbl">お寺の財布</span> <b id="wallet">¥0</b></div>
    <div class="blist" id="bList"></div>
    <h3 data-i18n="skinTitle">仏像を選ぶ</h3>
    <div class="skins" id="skinList"></div>
    <button class="btn gold-btn" id="templeClose" type="button" data-i18n="close">閉じる</button>
  </div>
</section>

<section id="result" class="screen hidden">
  <div class="result-title" id="resTitle">墜落…</div>
  <div class="card">
    <div class="stat"><div class="lbl" data-i18n="resAlt">到達高度</div><div class="val" id="resAlt">0m</div></div>
    <div class="stat"><div class="lbl" data-i18n="resMoney">獲得した賽銭</div><div class="val"><i class="coin-ico"></i><span id="resMoney">0</span></div></div>
    <div class="ribbon" id="resRibbon">大仏変身ボーナス！</div>
    <div class="lines" id="resLines"></div>
    <button class="btn gold-btn" id="resNext" type="button" data-i18n="again">もう一度遊ぶ</button>
    <button class="btn round" id="shareBtn" type="button" data-i18n="share">📷 記録をシェア</button>
    <button class="btn blue-btn" id="resTitleBtn" type="button" data-i18n="toTitle">タイトルに戻る</button>
  </div>
</section>

<section id="revive" class="screen hidden">
  <div class="card">
    <p class="revive-note" id="reviveNote"></p>
    <button class="btn gold-btn" id="reviveWatch" type="button">▶ 広告を見て復活する</button>
    <button class="btn round" id="reviveNext" type="button">つぎへ</button>
  </div>
</section>

<section id="pause" class="screen hidden">
  <div class="card">
    <h2 class="gold" data-i18n="pause">一時停止</h2>
    <button class="btn gold-btn" id="resumeBtn" type="button" data-i18n="resume">再開</button>
    <button class="btn round" id="pauseSound" type="button">♪ 音</button>
    <button class="btn blue-btn" id="quitBtn" type="button" data-i18n="toTitle">タイトルに戻る</button>
  </div>
</section>

<div id="nogl" class="screen hidden"><div class="card"><h2 class="gold" data-i18n="noglTitle">WebGLが使えません</h2><p data-i18n="noglText">このゲームは3D表示（WebGL）に対応したブラウザで遊べます。</p></div></div>

</div>
<script src="js/build-info.js"></script>
<script src="js/ads-config.js"></script>
<script src="js/ads.js?v=202611110116"></script>
<script type="module" src="js/main.js?v=202611110116"></script>
</body>
</html>
